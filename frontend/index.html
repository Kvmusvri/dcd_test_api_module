<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dcd — стенд</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">dcd</div>
      <div class="key-status" id="key-status" hidden>
        <span class="dot"></span><span id="key-status-text"></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="wrap" role="tab" aria-selected="true">Оклейка</button>
      <button class="tab" data-tab="color" role="tab" aria-selected="false">Колористика</button>
    </nav>

    <section class="composer" data-panel="wrap">
      <div class="slots">
        <div class="slot">
          <span class="slot-name">Авто клиента</span>
          <div class="slot-drop" data-slot="client_car" tabindex="0" role="button"
               aria-label="Фото авто клиента: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
        </div>
        <div class="slot">
          <span class="slot-name">Плёнка</span>
          <div class="slot-drop" data-slot="film" tabindex="0" role="button"
               aria-label="Фото плёнки: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
        </div>
        <div class="slot">
          <span class="slot-name">Референс</span>
          <div class="slot-drop" data-slot="reference" tabindex="0" role="button"
               aria-label="Референсы оклейки: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
          </div>
        </div>
      </div>

      <select id="provider" class="model-select" aria-label="Провайдер генерации">
        <option value="replicate">Replicate · Nano Banana (платно)</option>
        <option value="comfy">ComfyUI · Qwen-Image-Edit (локально)</option>
      </select>
      <select id="model" class="model-select" aria-label="Модель"></select>
      <button class="btn" id="generate-btn" disabled>Сгенерировать</button>
      <button class="btn btn-secondary" id="retry-btn" hidden>Повторить последнюю попытку</button>
      <p class="hint" id="provider-hint" hidden></p>
      <p class="hint" id="client-hint" hidden></p>
      <p class="error" id="gen-error" hidden></p>
    </section>

    <section class="results" data-panel="wrap">
      <p class="empty" id="results-empty">Результат появится здесь после генерации</p>
      <div class="grid" id="results-grid"></div>
    </section>

    <section class="history" id="history" data-panel="wrap" hidden>
      <div class="dates" id="dates"></div>
      <div class="day" id="day"></div>
    </section>

    <section class="color-tool" data-panel="color" hidden>
      <p class="color-note">
        Загрузи два фото — генерацию и референс. Стенд сам найдёт кузов (ROI по цвету),
        соберёт квадратик-градиент «тень → свет» и посчитает ΔE2000 — объективную
        разницу цвета, без «на глаз».
      </p>
      <div class="slots">
        <div class="slot">
          <span class="slot-name">Генерация</span>
          <div class="slot-drop" data-cslot="left" tabindex="0" role="button"
               aria-label="Фото генерации: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
        </div>
        <div class="slot">
          <span class="slot-name">Референс</span>
          <div class="slot-drop" data-cslot="right" tabindex="0" role="button"
               aria-label="Фото референса: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
        </div>
      </div>
      <button class="btn" id="color-btn" disabled>Сравнить цвета</button>
      <p class="error" id="color-error" hidden></p>
      <div class="color-result" id="color-result" hidden></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
