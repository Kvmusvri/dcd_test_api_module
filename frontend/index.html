<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dcd — стенд</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">dcd</div>
      <div class="key-status" id="key-status" hidden>
        <span class="dot"></span><span id="key-status-text"></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="composer">
      <div class="slots">
        <div class="slot">
          <span class="slot-name">Авто клиента</span>
          <div class="slot-drop" data-slot="client_car" tabindex="0" role="button"
               aria-label="Фото авто клиента: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
        </div>
        <div class="slot">
          <span class="slot-name">Плёнка</span>
          <div class="slot-drop" data-slot="film" tabindex="0" role="button"
               aria-label="Фото плёнки: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
        </div>
        <div class="slot">
          <span class="slot-name">Референс</span>
          <div class="slot-drop" data-slot="reference" tabindex="0" role="button"
               aria-label="Референсы оклейки: перетащите или нажмите">
            <input type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
          </div>
        </div>
      </div>

      <select id="model" class="model-select" aria-label="Модель"></select>
      <select id="resolution" class="model-select" aria-label="Качество">
        <option value="1K">1K — быстро</option>
        <option value="2K" selected>2K — баланс</option>
        <option value="4K">4K — максимум деталей</option>
      </select>
      <button class="btn" id="generate-btn" disabled>Сгенерировать</button>
      <button class="btn btn-secondary" id="retry-btn" hidden>Повторить последнюю попытку</button>
      <p class="error" id="gen-error" hidden></p>
    </section>

    <section class="results">
      <p class="empty" id="results-empty">Результат появится здесь после генерации</p>
      <div class="grid" id="results-grid"></div>
    </section>

    <section class="history" id="history" hidden>
      <div class="dates" id="dates"></div>
      <div class="day" id="day"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
